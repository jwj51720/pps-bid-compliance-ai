# EXP054: Exact EXP053 counterpart.  The document cap is the only difference.
experiment:
  id: exp-054-baseline-inspired-clean-full-full200
  derived_data: []
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: null
output:
  dir: outputs/exp-054-baseline-inspired-clean-full-full200
prompt:
  max_document_chars: null
  context_strategy: single
  overflow_split_enabled: true
  strict_document_evidence: false
  absence_detection_strategy: per_pass_or
  decision_cards_path: null
  competition_products_path: null
  layout: markdown_v2
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true
  concurrency: 4
  local_limit: null
