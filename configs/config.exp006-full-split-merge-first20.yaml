# Controlled first-20 comparison: only the document-pass strategy differs
# from the no-law full-context baseline.
experiment:
  id: exp-006-full-split-merge-first20
  derived_data: []

data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json

output:
  dir: outputs/exp-006-full-split-merge-first20

prompt:
  max_document_chars: null
  context_strategy: full_split_merge
  overflow_split_enabled: true
  strict_document_evidence: false
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false

llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0

run:
  resume: true
  concurrency: 4
  local_limit: 20
