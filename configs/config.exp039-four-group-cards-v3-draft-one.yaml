# Review-only mock configuration for decision_cards_v3_draft; not a paid result.
experiment:
  id: exp-039-four-group-cards-v3-draft-one
  derived_data: [decision_cards_v3_draft, competition_products_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
output:
  dir: outputs/exp-039-four-group-cards-v3-draft-one
prompt:
  max_document_chars: null
  context_strategy: full_split_merge
  overflow_split_enabled: true
  strict_document_evidence: true
  absence_detection_strategy: per_pass_and
  decision_cards_path: data/derived/decision_cards_v3_draft.json
  competition_products_path: data/derived/competition_products_v1.json
  layout: markdown_v2 # options: plain, markdown, markdown_v2; review v3 card presentation
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true
  concurrency: 1
  local_limit: 1
