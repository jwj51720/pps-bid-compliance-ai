# Isolated v24 overlay: reuse EXP086's exact G01/G02 model outputs and run only
# the new v24 consistency call. This avoids attributing remote re-sampling of
# unchanged groups to the v24 split hypothesis.
experiment: {id: exp-088-probe-v3-g2-v24-overlay, base_config: configs/config.exp086-probe-v3-g1-absence-presence.yaml, allowed_policy_changes: [grouped_run.grouping, grouped_run.reuse_groups.group_ids, grouped_run.reuse_groups.output_dir], derived_data: [dev_prompt_probe_v3]}
data: {root: data/raw/open, input: dev.jsonl.gz, labels: dev_labels.csv, item_table: data/항목표.json, fast_panel_ids_path: configs/dev_prompt_probe_v3.json}
output: {dir: outputs/exp-088-probe-v3-g2-v24-overlay}
prompt: {max_document_chars: 4000, context_strategy: single, overflow_split_enabled: false, strict_document_evidence: false, absence_detection_strategy: per_pass_or, decision_cards_path: null, competition_products_path: null, profile: default, item_catalog_style: minimal, metadata_style: full_json, layout: markdown_v2, output_mode: labels_and_evidence, max_model_len: 16384, output_reserve_tokens: 1536, notice_anchor_chars: 4000, mode: baseline, include_normalized_facts: false}
llm: {provider: openrouter, model: google/gemma-4-26b-a4b-it, api_key_env: OPENROUTER_API_KEY, api_url: https://openrouter.ai/api/v1/chat/completions, tokenizer_source: google/gemma-4-26b-a4b-it, temperature: 0.0, max_tokens: 1536, seed: 20260826, timeout_seconds: 180, request_retries: 3, prediction_attempts: 2, provider_sort: throughput, require_parameters: true, min_request_interval_seconds: 1.0}
run: {resume: true, concurrency: 4, local_limit: null}
grouped_run: {grouping: absence_presence_consistency_v1, reference_mode: none, reference_navigation: none, reuse_groups: {output_dir: outputs/exp-086-probe-v3-g1-absence-presence, group_ids: [G01_presence_items, G02_absence_items]}}
