# EXP047: same policy as EXP044; only the remote model and frozen fast panel differ.
experiment:
  id: exp-047-four-group-openai-gpt56-luna-fast-panel-v1
  derived_data: [decision_cards_v2, competition_products_v1, dev_fast_panel_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: configs/dev_fast_panel_v1.json
output:
  dir: outputs/exp-047-four-group-openai-gpt56-luna-fast-panel-v1
prompt:
  max_document_chars: null
  context_strategy: full_split_merge
  overflow_split_enabled: true
  strict_document_evidence: true
  absence_detection_strategy: per_pass_and
  decision_cards_path: data/derived/decision_cards_v2.json
  competition_products_path: data/derived/competition_products_v1.json
  layout: markdown_v2
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openai
  model: gpt-5.6-luna
  api_key_env: OPENAI_API_KEY
  api_url: https://api.openai.com/v1/responses
  # Preserve EXP044's tokenizer-admission contract; this is not an OpenAI
  # tokenizer approximation experiment.
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 60
  request_retries: 1
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 0.0
run:
  resume: true
  concurrency: 4
  local_limit: null
