# EXP097: EXP096 with label-only model output.  Evidence cannot be validated
# without an emitted source substring, so this deliberately disables only the
# evidence gate and v8's auxiliary observation serialization; document/context
# routing, cards, groups, and final merge remain unchanged.
experiment:
  id: exp-097-three-group-v5-fullsplit-2500-vonly-full200
  base_config: configs/config.exp096-three-group-v5-fullsplit-2500-full200.yaml
  allowed_policy_changes: [prompt.output_mode, prompt.strict_document_evidence, prompt.v8_composite_merge.enabled]
  derived_data: [decision_cards_v5, competition_products_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: null
output:
  dir: outputs/exp-097-three-group-v5-fullsplit-2500-vonly-full200
prompt:
  max_document_chars: null # options: null, positive integer
  context_strategy: full_split_merge # options: single, single_no_split, split, full_split_merge
  overflow_split_enabled: true # options: true, false
  strict_document_evidence: false # options: true, false
  absence_detection_strategy: per_pass_and # options: per_pass_or, per_pass_and
  decision_cards_path: data/derived/decision_cards_v5.json
  competition_products_path: data/derived/competition_products_v1.json
  profile: default # options: default, official_baseline_v1
  item_catalog_style: minimal # options: minimal, official_references
  metadata_style: full_json # options: full_json, official_lines
  layout: markdown_v2 # options: plain, markdown, markdown_v2
  output_mode: labels_only # options: labels_and_evidence, labels_only, labels_and_anchor, labels_and_sparse_evidence
  max_model_len: 16384
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline # options: baseline, structured, guided
  include_normalized_facts: false # options: true, false
v8_composite_merge:
  enabled: false # options: false, true
  mode: fallback_or # options: fallback_or, strict_conjunction
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 0.0
run:
  resume: true # options: true, false
  concurrency: 20
  local_limit: null
grouped_run:
  grouping: absence_presence_consistency_v1
  reference_mode: none
  reference_navigation: none
  group_context_overrides:
    G01_presence_items: {max_document_chars: null, context_strategy: full_split_merge, overflow_split_enabled: true, absence_detection_strategy: per_pass_or}
    G02_absence_items: {max_document_chars: null, context_strategy: full_split_merge, overflow_split_enabled: true, absence_detection_strategy: per_pass_and}
    G03_document_metadata_consistency: {max_document_chars: null, context_strategy: full_split_merge, overflow_split_enabled: true, absence_detection_strategy: per_pass_or}
