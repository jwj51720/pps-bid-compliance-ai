# Low-cost fixed cohort: PPS-DEV-01 through PPS-DEV-20.
experiment:
  id: exp-005-v1-law-reference-probe-first20
  derived_data: [law_reference_v1_v1]

data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json

output:
  dir: outputs/exp-005-v1-law-reference-probe-first20-rerun

prompt:
  max_document_chars: null
  overflow_split_enabled: true
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
  reference_path: data/derived/law_reference_v1_v1.json

llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0

run:
  resume: true
  concurrency: 4
  local_limit: 20
