# EXP041: concise derived legal guardrails, not raw-law text.
# Isolates whether source-audited applicability conditions and exceptions help
# beyond EXP038's v2 cards and cleaned prompt.
experiment:
  id: exp-041-four-profile-four-group-legal-guardrails-first20
  derived_data: [decision_cards_v2, competition_products_v1, legal_guardrail_profile_group_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
output:
  dir: outputs/exp-041-four-profile-four-group-legal-guardrails-first20
prompt:
  max_document_chars: null
  context_strategy: full_split_merge
  overflow_split_enabled: true
  strict_document_evidence: true
  absence_detection_strategy: per_pass_and
  decision_cards_path: data/derived/decision_cards_v2.json
  competition_products_path: data/derived/competition_products_v1.json
  reference_bundle_dir: data/derived/legal_guardrail_profile_group_v1
  reference_routing: metadata_profile_group_v2
  layout: markdown_v2 # options: plain, markdown, markdown_v2; compact legal guardrails require clear section boundaries
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true
  concurrency: 4
  local_limit: 20
