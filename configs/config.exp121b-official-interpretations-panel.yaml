# EXP121B changes only card wording pre-authorized by official public
# interpretations. See docs/official_interpretation_alignment_plan.md.
experiment:
  id: exp-121b-official-interpretations-panel
  base_config: configs/config.exp121a-card-v6-official-panel.yaml
  allowed_policy_changes: [prompt.decision_cards_path]
  derived_data: [decision_cards_v8_official_interpretations, dev_official_interpretation_panel_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: configs/dev_official_interpretation_panel_v1.json
output:
  dir: outputs/exp-121b-official-interpretations-panel
prompt:
  max_document_chars: 4000
  context_strategy: single
  overflow_split_enabled: false
  strict_document_evidence: false
  absence_detection_strategy: per_pass_or
  decision_cards_path: data/derived/decision_cards_v8_official_interpretations.json
  competition_products_path: null
  profile: official_baseline_v1
  layout: plain
  role_directive: standard
  output_mode: labels_and_evidence
  max_model_len: 16384
  output_reserve_tokens: 1536
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 1536
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true # options: true, false
  concurrency: 20 # options: 1..20
  local_limit: null
