# EXP138: source-coverage ablation for v9 only. All other items retain EXP133
# organizer-format 4,000-character single-context execution.
experiment:
  id: exp-138-v9-source-coverage-fast-panel
  base_config: configs/config.exp133-two-way-g02-fast-panel.yaml
  allowed_policy_changes: [grouped_run.grouping, grouped_run.group_context_overrides.G03_specification_model.context_strategy, grouped_run.group_context_overrides.G03_specification_model.max_document_chars, grouped_run.group_context_overrides.G03_specification_model.overflow_split_enabled]
  derived_data: [dev_fast_panel_v1]
  lifecycle: diagnostic
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: configs/dev_fast_panel_v1.json
output:
  dir: outputs/exp-138-v9-source-coverage-fast-panel
prompt:
  max_document_chars: 4000
  context_strategy: single
  overflow_split_enabled: false
  strict_document_evidence: false
  absence_detection_strategy: per_pass_or
  decision_cards_path: null
  competition_products_path: null
  profile: official_baseline_subset_v1
  layout: plain
  role_directive: standard
  item_catalog_style: minimal
  metadata_style: official_lines
  output_mode: labels_and_evidence
  max_model_len: 16384
  output_reserve_tokens: 1536
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 1536
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true
  concurrency: 4
  local_limit: null
grouped_run:
  grouping: document_restrictions_v9_source_v1
  reference_mode: none
  reference_navigation: none
  group_context_overrides:
    G03_specification_model:
      max_document_chars: null
      context_strategy: full_split_merge
      overflow_split_enabled: true
