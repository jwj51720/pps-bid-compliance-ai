# EXP111: full-dev confirmation of EXP110.  No policy difference is allowed.
experiment:
  id: exp-111-card-v6-single-adaptive-full200
  base_config: configs/config.exp110-card-v6-single-adaptive-fast-panel.yaml
  allowed_policy_changes: []
  derived_data: [decision_cards_v6, competition_products_v1]
data:
  root: data/raw/open
  input: dev.jsonl.gz
  labels: dev_labels.csv
  item_table: data/항목표.json
  fast_panel_ids_path: null
output:
  dir: outputs/exp-111-card-v6-single-adaptive-full200
prompt:
  max_document_chars: null
  context_strategy: single
  overflow_split_enabled: true
  strict_document_evidence: false
  absence_detection_strategy: per_pass_or
  decision_cards_path: data/derived/decision_cards_v6.json
  competition_products_path: data/derived/competition_products_v1.json
  layout: plain
  role_directive: standard
  max_model_len: 32768
  output_reserve_tokens: 2500
  notice_anchor_chars: 4000
  mode: baseline
  include_normalized_facts: false
llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it
  api_key_env: OPENROUTER_API_KEY
  api_url: https://openrouter.ai/api/v1/chat/completions
  tokenizer_source: google/gemma-4-26b-a4b-it
  temperature: 0.0
  max_tokens: 2500
  seed: 20260826
  timeout_seconds: 180
  request_retries: 3
  prediction_attempts: 2
  provider_sort: throughput
  require_parameters: true
  min_request_interval_seconds: 1.0
run:
  resume: true
  concurrency: 4
  local_limit: null
